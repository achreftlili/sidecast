# XcodeGen spec of the iPhone / iPad app. Sidecast.xcodeproj is generated from
# it and committed, so building needs only Xcode. After editing this file run
# `xcodegen` in this directory (brew install xcodegen) and commit both.
name: Sidecast
options:
  bundleIdPrefix: com.achreftlili
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Sidecast.xcconfig
  Release: Config/Sidecast.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  Sidecast:
    path: ../mac
targets:
  # Not "Sidecast": the local package has an executable target of that name (the
  # Mac app), and Xcode would resolve the UI tests' target to it. The product is Sidecast.app.
  SidecastApp:
    type: application
    platform: iOS
    sources:
      - path: Sidecast
        excludes:
          - Info.plist
    dependencies:
      - package: Sidecast
        product: SidecastKit
    settings:
      base:
        PRODUCT_NAME: Sidecast
        PRODUCT_BUNDLE_IDENTIFIER: $(SIDECAST_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Sidecast/Info.plist
      properties:
        CFBundleDisplayName: Sidecast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        # The display is landscape-only; the list may rotate. Full screen, so the
        # display screen is never squeezed into a window on iPad.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 120 Hz on ProMotion iPhones too (the stream follows the host's fps setting).
        CADisableMinimumFrameDurationOnPhone: true
        # An iPad's trackpad or mouse clicks arrive as touches.
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: Sidecast finds the computers running Sidecast on this network and connects to them.
        NSBonjourServices:
          - _sidecast._tcp
        NSMicrophoneUsageDescription: While an app on your computer records from “Sidecast Microphone”, Sidecast sends this device’s microphone to it.
  SidecastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SidecastTests
    dependencies:
      - target: SidecastApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(SIDECAST_BUNDLE_ID).tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sidecast.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Sidecast
        BUNDLE_LOADER: $(TEST_HOST)
  SidecastUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SidecastUITests
    dependencies:
      - target: SidecastApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(SIDECAST_BUNDLE_ID).uitests
        TEST_TARGET_NAME: SidecastApp
schemes:
  Sidecast:
    build:
      targets:
        SidecastApp: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SidecastTests
        - SidecastUITests
    archive:
      config: Release
