name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        working-directory: mac
        run: swift test
      - name: Build Sidecast.app (ad-hoc signed) and the mic driver check
        run: make mac
      - name: Intel build compiles
        working-directory: mac
        run: swift build -c release --arch x86_64

  ios:
    name: iOS app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build for the iOS Simulator (unsigned) and run the app's unit tests
        run: make test-ios

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and release APK (debug-key signed)
        run: make android

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
      # Integration tests pick a free port: Windows may refuse to rebind one with connections in TIME_WAIT.
      SIDECAST_TEST_PORT: '0'
    steps:
      - uses: actions/checkout@v7
      - name: Linux host build dependencies (PipeWire, libclang for its bindings, GStreamer)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config clang libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-bad
      - name: Rust toolchain (stable, rustfmt, clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy without OpenH264
        run: cargo clippy -p sidecast-server -p sidecast-host -p sidecast-probe --no-default-features --all-targets -- -D warnings
      - name: Clippy and tests with the GStreamer encoders (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p sidecast-host --features gstreamer --all-targets -- -D warnings
          cargo test -p sidecast-host --features gstreamer
      - name: Tests
        run: cargo test
        env:
          # Windows: the SendInput test may move the pointer of this throwaway desktop.
          SIDECAST_TEST_REAL_INPUT: ${{ runner.os == 'Windows' && '1' || '' }}
      - name: Host ↔ probe end to end
        working-directory: .
        run: ./scripts/conformance.sh --rust-only
      - name: Windows host with its real backends (capture, encoders, input) and the tray app ↔ probe
        if: runner.os == 'Windows'
        working-directory: .
        run: ./scripts/windows-e2e.sh --tray

  windows-virtual-display:
    name: Windows installer and virtual display
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install from source (scripts/install-windows.ps1, Windows PowerShell 5.1)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\install-windows.ps1 -InstallDir "$env:RUNNER_TEMP\Sidecast" -NoLaunch
      - name: Install the Virtual Display Driver (its official signed release, checksums pinned)
        id: vdd
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'vdd'
          New-Item -ItemType Directory -Force $work | Out-Null
          function Get-Verified([string]$Url, [string]$Sha256, [string]$Out) {
            Invoke-WebRequest -Uri $Url -OutFile $Out -UseBasicParsing
            $actual = (Get-FileHash -Algorithm SHA256 $Out).Hash.ToLowerInvariant()
            if ($actual -ne $Sha256) { throw "checksum mismatch for $Url ($actual)" }
          }
          Get-Verified 'https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VirtualDisplayDriver-x86.Driver.Only.zip' `
            'e24210692b442b39af763536330ce78b423f19342b7a7792c26de3944e418b3a' "$work\vdd.zip"
          Get-Verified 'https://github.com/nefarius/nefcon/releases/download/v1.21.0/nefcon_v1.21.0.zip' `
            '4c8e68f6b663598d77b7c3f76459b16fad00994e53ea8af0bd106a805dd5c18b' "$work\nefcon.zip"
          Expand-Archive "$work\vdd.zip" "$work\vdd" -Force
          Expand-Archive "$work\nefcon.zip" "$work\nefcon" -Force
          # Settings like the driver's own installer writes, so Sidecast can add the phone's resolution.
          New-Item -ItemType Directory -Force 'C:\VirtualDisplayDriver' | Out-Null
          Set-Content -Encoding UTF8 'C:\VirtualDisplayDriver\vdd_settings.xml' @'
          <?xml version='1.0' encoding='utf-8'?>
          <vdd_settings>
              <monitors>
                  <count>1</count>
              </monitors>
              <gpu>
                  <friendlyname>default</friendlyname>
              </gpu>
              <global>
                  <g_refresh_rate>60</g_refresh_rate>
              </global>
              <resolutions>
                  <resolution>
                      <width>1920</width>
                      <height>1080</height>
                      <refresh_rate>60</refresh_rate>
                  </resolution>
              </resolutions>
          </vdd_settings>
          '@
          # Trust the driver's publisher first, as its installer does, so Windows installs it without a prompt.
          $cat = Get-ChildItem -Recurse "$work\vdd" -Filter 'mttvdd.cat' | Select-Object -First 1
          $certs = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2Collection
          $certs.Import([IO.File]::ReadAllBytes($cat.FullName))
          foreach ($cert in $certs) {
            $file = Join-Path $work "$($cert.Thumbprint).cer"
            [IO.File]::WriteAllBytes($file, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
            Import-Certificate -FilePath $file -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' | Out-Null
          }
          $inf = Get-ChildItem -Recurse "$work\vdd" -Filter 'MttVDD.inf' | Select-Object -First 1
          $nefcon = Get-ChildItem -Recurse "$work\nefcon" -Filter 'nefconc.exe' | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          & $nefcon.FullName install $inf.FullName 'Root\MttVDD'
          for ($i = 0; $i -lt 60; $i++) {
            if ([IO.Directory]::GetFiles('\\.\pipe\') -like '*MTTVirtualDisplayPipe') { break }
            Start-Sleep -Seconds 1
          }
          Get-PnpDevice -Class Display | Format-Table -AutoSize Status, FriendlyName, InstanceId
          if (-not ([IO.Directory]::GetFiles('\\.\pipe\') -like '*MTTVirtualDisplayPipe')) { throw 'the driver did not start (no control pipe)' }
      - name: Host on a Virtual Display Driver monitor ↔ probe
        if: steps.vdd.outcome == 'success'
        shell: bash
        run: ./scripts/windows-e2e.sh --expect-virtual-display
      - name: Virtual Display Driver unavailable on this runner
        if: steps.vdd.outcome != 'success'
        shell: bash
        run: echo "::warning::The Virtual Display Driver could not be installed on this runner, so the virtual-monitor path was not exercised"

  linux-gnome:
    name: Linux host on headless GNOME
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Headless GNOME (Mutter, PipeWire, WirePlumber), a Wayland test client, build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mutter pipewire pipewire-bin wireplumber \
            dbus-daemon libglib2.0-bin python3-gi gir1.2-glib-2.0 adwaita-icon-theme \
            pkg-config clang libclang-dev libpipewire-0.3-dev
          sudo apt-get install -y -qq --no-install-recommends wev || echo "no wev: the keyboard check is skipped"
          . /etc/os-release && echo "$PRETTY_NAME, $(mutter --version | head -1)"
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Real GNOME backend ↔ probe (virtual monitor, capture, input, mic, tray)
        run: TMPDIR="$RUNNER_TEMP" ./scripts/linux-e2e.sh
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gnome-e2e-logs
          path: ${{ runner.temp }}/sidecast-linux-e2e.*

  conformance:
    name: Swift ↔ Rust conformance
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Rust probe ↔ Rust host, Swift probe ↔ Rust host, Rust probe ↔ Mac host
        run: ./scripts/conformance.sh
