name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        working-directory: mac
        run: swift test
      - name: Build Sidecast.app (ad-hoc signed) and the mic driver check
        run: make mac
      - name: Intel build compiles
        working-directory: mac
        run: swift build -c release --arch x86_64

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and release APK (debug-key signed)
        run: make android
