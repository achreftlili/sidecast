name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        working-directory: mac
        run: swift test
      - name: Build Sidecast.app (ad-hoc signed) and the mic driver check
        run: make mac
      - name: Intel build compiles
        working-directory: mac
        run: swift build -c release --arch x86_64

  ios:
    name: iOS app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build for the iOS Simulator (unsigned) and run the app's unit tests
        run: make test-ios

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and release APK (debug-key signed)
        run: make android

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
      # Integration tests pick a free port: Windows may refuse to rebind one with connections in TIME_WAIT.
      SIDECAST_TEST_PORT: '0'
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (stable, rustfmt, clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy without OpenH264
        run: cargo clippy -p sidecast-server -p sidecast-host -p sidecast-probe --no-default-features --all-targets -- -D warnings
      - name: Tests
        run: cargo test
        env:
          # Windows: the SendInput test may move the pointer of this throwaway desktop.
          SIDECAST_TEST_REAL_INPUT: ${{ runner.os == 'Windows' && '1' || '' }}
      - name: Host ↔ probe end to end
        working-directory: .
        run: ./scripts/conformance.sh --rust-only
      - name: Windows host with its real backends (capture, encoders, input) ↔ probe
        if: runner.os == 'Windows'
        working-directory: .
        run: ./scripts/windows-e2e.sh

  conformance:
    name: Swift ↔ Rust conformance
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Rust probe ↔ Rust host, Swift probe ↔ Rust host, Rust probe ↔ Mac host
        run: ./scripts/conformance.sh
