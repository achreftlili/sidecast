[package]
name = "sidecast-host"
description = "Sidecast host for Windows and Linux (command line, Windows tray app; platform backends plug into sidecast-server)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

# The console host: test-pattern mode on any OS, the real backends on Windows and Linux (with a tray icon on Linux).
[[bin]]
name = "sidecast-host"
path = "src/main.rs"

# The Windows tray app (a GUI-subsystem binary, so no console window); elsewhere it only says so.
[[bin]]
name = "sidecast-tray"
path = "src/bin/sidecast-tray.rs"

[features]
default = ["openh264"]
# Software H.264 encoder; without it the host has no encoder until a platform backend provides one.
openh264 = ["sidecast-server/openh264"]
# Linux: hardware H.264 (VA-API, NVENC) through the system's GStreamer (LGPL, linked dynamically).
gstreamer = ["dep:gstreamer", "dep:gstreamer-app"]

[dependencies]
sidecast-core.workspace = true
sidecast-server.workspace = true

log.workspace = true
tokio = { workspace = true, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux backends (see THIRD_PARTY_NOTICES.md): D-Bus (Mutter, portals, logind, tray) and PipeWire.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast", "remote_desktop"] }
async-io = "2"
futures-lite = "2"
pipewire = { version = "0.10", features = ["v0_3_49"] }
serde.workspace = true
zbus = "5"
gstreamer = { version = "0.24", optional = true }
gstreamer-app = { version = "0.24", optional = true }

[lints]
workspace = true
