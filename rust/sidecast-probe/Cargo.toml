[package]
name = "sidecast-probe"
description = "Sidecast conformance client: a scripted fake phone that checks a host against docs/PROTOCOL.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sidecast-probe"
path = "src/main.rs"

[features]
default = ["openh264"]
# Decode H.264 streams with OpenH264 and check every frame (HEVC is checked structurally only).
openh264 = ["dep:openh264"]

[dependencies]
sidecast-core.workspace = true

log.workspace = true
openh264 = { workspace = true, optional = true }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true

[lints]
workspace = true
